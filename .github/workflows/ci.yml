name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify brag-slim synchronization
        run: node scripts/check-brag-slim.mjs

      - name: Verify docs links and media integrity
        run: node scripts/check-docs.mjs
